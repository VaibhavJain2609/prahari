[project]
name = "prahari-loadtest"
version = "0.1.0"
description = "PRAHARI load-test harness — synthetic camera farm + stepped driver for docs/SCALE-80K.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "prahari-proto",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_loadtest"]

[tool.uv.sources]
prahari-proto = { workspace = true }

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
