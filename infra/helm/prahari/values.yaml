# Base values. Shared by every profile.
#
# INVARIANT: `profile` (local | gpu) is the ONLY thing that differs between the
# laptop and the cloud. If a cutover ever needs a code change, the switch is
# wrong — fix the switch, not the code.
#
# Override with values-local.yaml or values-gpu.yaml.

profile: local

global:
  imageRegistry: localhost:5555
  imageTag: dev
  pullPolicy: IfNotPresent

# --- the metadata plane ------------------------------------------------------

bus:
  # Redis Streams locally; Redpanda under the gpu profile for the scale test.
  # Same protobuf messages either way — one schema, two transports.
  kind: redis
  retentionHours: 24

postgres:
  enabled: true
  image: postgis/postgis:16-3.4
  database: prahari
  user: prahari
  storage: 10Gi

redis:
  enabled: true
  image: redis:7-alpine

# --- ingest ------------------------------------------------------------------

mediamtx:
  # One upstream pull per camera, fanned out to all consumers. Every client gets
  # its own copy of the source stream, so direct per-consumer connections would
  # exhaust the government feed.
  enabled: true
  image: bluenviron/mediamtx:1.9.3
  rtspPort: 8554
  hlsPort: 8888
  whepPort: 8889

# --- services ----------------------------------------------------------------

services:
  registry:
    replicas: 1
    port: 8000
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }

  matchEngine:
    replicas: 1
    port: 8001
    grpcPort: 9001
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: "2",  memory: 2Gi }

  correlation:
    replicas: 1
    port: 8002
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: "2",  memory: 2Gi }

  bff:
    replicas: 1
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }

  web:
    replicas: 1
    port: 3000
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }

# --- inference: the profile-sensitive service --------------------------------

inference:
  replicas: 1

  # Overridden per profile. See values-local.yaml / values-gpu.yaml.
  model: yolov8n.pt
  decodeBackend: cpu          # cpu | videotoolbox | nvdec
  samplingFps: 2              # never native rate — most CCTV frames are static
  maxStreamsPerWorker: 5
  batchSize: 4                # batch ACROSS cameras, not within one
  motionGate: true
  gpu: false

  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "4", memory: 4Gi }

  keda:
    # Scale on stream-queue depth. Disabled locally (no GPU, and 3-5 streams
    # doesn't exercise it); the scale-up/scale-down curve is the demo beat
    # under the gpu profile.
    enabled: false
    minReplicas: 1
    maxReplicas: 20
    queueLengthTarget: 100

# --- security ----------------------------------------------------------------

audit:
  # Hash-chained audit log. There is no bypass path, in any profile —
  # "every video access is logged" is not a production-only property.
  enabled: true
  requirePurposeCode: true
