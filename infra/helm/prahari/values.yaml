# Base values. Shared by every profile.
#
# INVARIANT: `profile` (local | gpu | eks) is the ONLY thing that differs
# between the laptop and the cloud. If a cutover ever needs a code change,
# the switch is wrong — fix the switch, not the code.
#
# Override with values-local.yaml, values-gpu.yaml or values-eks.yaml.

profile: local

global:
  # The registry AS THE CLUSTER SEES IT, not as the host does. `make images`
  # and Tilt push to localhost:5555 (the k3d registry's host port); pods pull
  # through the containerd mirror at prahari-registry:5000. localhost:5555
  # here means every pod resolves "localhost" to itself and ImagePullBackOffs.
  imageRegistry: prahari-registry:5000
  imageTag: dev
  pullPolicy: IfNotPresent

# --- storage -----------------------------------------------------------------

storageClass:
  # When set, EVERY chart PVC requests this StorageClass — postgres' StatefulSet
  # volumeClaimTemplate, the bff audit PVC, and mediamtx recordings. Empty uses
  # the cluster's default provisioner (local-path on k3d, gp2 on EKS). It is a
  # knob rather than a per-PVC value because the right answer differs per
  # cluster and must never diverge between claims in one release.
  name: ""
  # Render the class itself alongside the claims (templates/storageclass.yaml):
  # gp3, encrypted, WaitForFirstConsumer, Retain. The eks profile sets this —
  # it needs the aws-ebs-csi-driver addon, which infra/terraform/envs/eks
  # installs. Local stays false (k3d's local-path provisioner already exists).
  create: false

# --- TLS at the load balancer ---------------------------------------------------

# eks-only today: ACM cert ARN + the public hostnames. When enabled, the web
# and mediamtx-public NLB services get a 443 listener that terminates TLS
# (plain ports stay open alongside — RTSP cannot wrap in TLS anyway), and
# deploy tooling flips sessionCookieSecure to true. The cert is provisioned
# by infra/terraform/envs/eks (aws_acm_certificate); ARN/hosts arrive via
# deploy tooling (--set), not by editing this file.
tls:
  enabled: false
  acmArn: ""
  consoleHost: ""
  streamsHost: ""

# --- the metadata plane ------------------------------------------------------

# The bus is Redis Streams in every profile. There is no `bus.kind` switch:
# no Redpanda chart exists and no settings field read PRAHARI_BUS_KIND, so the
# value was a knob that switched nothing. Redpanda for the scale test is
# deferred — reintroduce it as a real deployment plus a real settings field
# together, or the "switch" is silent.

postgres:
  enabled: true
  # Name of a pre-existing Secret holding `key: password` — the out-of-band
  # pattern the gateway Secret already uses (`kubectl create secret generic
  # prahari-postgres-auth --from-literal=password=...`, then set this to
  # "prahari-postgres-auth"). When empty the chart generates a Secret, annotated
  # helm.sh/resource-policy: keep so an upgrade never re-rolls the password
  # under an existing PVC — Postgres auth lives in PGDATA, so a rotated
  # password breaks every client permanently.
  existingSecret: ""
  # PostGIS is mandatory: the registry's coverage and dark-zone queries are
  # ST_Distance / KNN on geography(Point, 4326), and there is no fallback.
  #
  # TimescaleDB is NOT in this image, and migration 003 degrades to a plain
  # table when the extension is absent — heartbeat retention then falls to the
  # registry's own pruner. Swapping in a Timescale-bearing image (the
  # `timescale/timescaledb-ha` line carries PostGIS too) gets the hypertable
  # back. UNVERIFIED: the exact tag has not been pulled or tested here, so it is
  # not the default; verify it on Day 4 alongside the GPU cutover rather than
  # discovering it on demo morning.
  image: postgis/postgis:16-3.4
  database: prahari
  user: prahari
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

redis:
  enabled: true
  # Pinned to the Alpine base — a floating `-alpine` tag that moves under us is
  # the same class of surprise as `latest`.
  image: redis:7.4-alpine3.21
  # Name of a pre-existing Secret holding `key: password` — the same
  # out-of-band pattern as postgres.existingSecret. When empty the chart
  # generates `prahari-redis-auth` (helm.sh/resource-policy: keep) and runs
  # redis-server --requirepass; consumers pick the password up as
  # $(REDIS_PASSWORD) inside their redis:// URL — it never lands in rendered
  # YAML. If the Secret is absent entirely the deployment degrades to
  # passwordless on BOTH ends together (server --requirepass "", client URL
  # with an empty password) — loudly equivalent to the internal-token
  # convention, not a silent half-authenticated state.
  #
  # The KEDA redis-streams scaler in inference.yaml carries the same
  # credential — it mounts it via a TriggerAuthentication
  # (secretTargetRef → prahari-redis-auth/password), so a requirepass-armed
  # Redis does not leave the gpu profile's scale trigger reading NOAUTH.
  existingSecret: ""
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- ingest ------------------------------------------------------------------

mediamtx:
  # One upstream pull per camera, fanned out to all consumers. Every client gets
  # its own copy of the source stream, so direct per-consumer connections would
  # exhaust the government feed.
  enabled: true
  image: bluenviron/mediamtx:1.9.3
  rtspPort: 8554
  hlsPort: 8888
  whepPort: 8889
  # The control API the registry writes paths to. Cluster-internal only — it is
  # deliberately absent from infra/k3d/cluster.yaml's host port mappings, because
  # nothing outside the cluster has any business reconfiguring the restreamer.
  apiPort: 9997
  # Prometheus-compatible metrics endpoint (mediamtx `metrics: yes`).
  metricsPort: 9998
  # Host the registry puts into the fan-out URLs it hands to in-cluster
  # consumers — the inference workers' RTSP/HLS pull URLs (worker.py prefers
  # fanout_rtsp_url), which since the audited-video-access change carry an
  # embedded `worker:<worker-token>` credential (a dedicated secret, not the
  # internal API token) and are never shown to a browser. The cluster service
  # name is therefore the right value in EVERY profile — browser reachability
  # is `browserWhepBase` below, not this.
  publicHost: prahari-mediamtx
  # The WHEP base URL the BFF embeds in preview-ticket responses — as the
  # BROWSER can reach it. `localhost:8889` works through k3d's port maps; the
  # gpu profile must set this to the public ingress URL (and that ingress
  # must pass the Authorization header or the `?jwt=` query through).
  browserWhepBase: "http://localhost:8889"
  # A SECOND, public-facing Service, rendered only when enabled: a cloud
  # LoadBalancer exposing ONLY the media ports (rtsp/hls/whep). The main
  # service stays ClusterIP, so the control API (9997) and metrics (9998) —
  # which must never be internet-published — remain cluster-internal. The eks
  # profile uses this; local instead sets serviceType: LoadBalancer on the
  # main service because k3d's port maps want every port on one LB anyway.
  publicLb:
    enabled: false
    # AWS example: {"service.beta.kubernetes.io/aws-load-balancer-type": "nlb"}
    annotations: {}
  # Evidence recording. OFF by default: recording multiplies MediaMTX disk by
  # every camera's bitrate — on the 80k estate this is an edge/DVR concern,
  # not a central one. Enable it for the footage-backed evidence path
  # (docs/EVIDENCE.md): `playback` tickets already grant the right action, so
  # flipping this makes POST /evidence/requests/{id}/ticket serve real bytes.
  record:
    enabled: false
    path: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    format: fmp4
    partDuration: 1s
    segmentDuration: 60s
    # How long clips are kept before MediaMTX deletes them — 24h covers the
    # evidence-request workflow without growing the PVC unboundedly.
    deleteAfter: 24h
    storageSize: 50Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }

# --- registry: the control plane ---------------------------------------------

registry:
  # Which catalogue these cameras came from. Stored per camera, so a Model 2
  # direct-connect camera and a gateway camera are distinguishable forever —
  # and so a second gateway can be added without either one adopting the
  # other's cameras when ids collide.
  catalogueSource: gujarat-sentinel

  sync:
    enabled: true
    # Ids rotate and cameras come and go. Five minutes is frequent enough that
    # the map is never far wrong and infrequent enough to stay a courteous
    # consumer of a shared government gateway.
    intervalSeconds: 300
    onStartup: true

  health:
    # Roughly 4x the worker heartbeat interval, so one dropped report is not an
    # outage.
    staleAfterSeconds: 45
    heartbeatRetentionDays: 14

  assignment:
    # Worker-sharding lease (→ PRAHARI_ASSIGNMENT_LEASE_S): how long a
    # registered ingest worker's membership survives without a re-register.
    # Alive-for-sharding = last_seen within 2x this; the row is reaped at 3x.
    # Keep it comfortably above inference.assignmentRefreshSeconds.
    leaseSeconds: 60

  # Per-worker credential binding (→ PRAHARI_WORKER_SECRET_REQUIRED, migration
  # 010): refuse registrations that would leave a worker_id unbound. Off so
  # un-upgraded workers keep registering while the fleet upgrades — arm it
  # once every worker requests a secret, after which the shared
  # inference-token authorizes only NEW ids, never an already-bound one.
  workerSecretRequired: false

  # Name of the Secret holding the gateway credentials. Created out of band:
  #   kubectl create secret generic prahari-gateway --from-env-file=.env
  # NEVER in this file, never in tfvars, never in a commit. Mounted into the
  # registry Deployment only — no other service needs it.
  gatewaySecret: prahari-gateway

# --- services ----------------------------------------------------------------

# `enabled` exists because the chart is written ahead of the services. A
# Deployment for an image that has not been built yet leaves `make up --wait`
# hanging on a pod that will never start, which reads as "the platform is
# broken" rather than "Day 3 has not happened yet". Flip each one on with the
# service it deploys.
services:
  registry:
    enabled: true
    replicas: 1
    port: 8000
    # /metrics rides the main HTTP port (prahari_registry/metrics.py) — same
    # convention as matchEngine: metricsPort repeats `port` so the scrape
    # annotation follows it.
    metricsPort: 8000
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }

  matchEngine:
    enabled: true
    replicas: 1
    port: 8001
    grpcPort: 9001
    # /metrics is served on the HTTP port itself (prahari_match/metrics.py) —
    # metricsPort deliberately repeats `port`: it is the scraper-facing key
    # that drives the prometheus.io/port pod annotation when
    # observability.prometheusScrape is on, and must move WITH `port`.
    metricsPort: 8001
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: "2",  memory: 2Gi }

  correlation:
    enabled: false
    replicas: 1
    port: 8002
    # Same as matchEngine: /metrics rides the main HTTP port (a route on the
    # FastAPI app, not a side listener). Repeats `port` on purpose.
    metricsPort: 8002
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: "2",  memory: 2Gi }

  bff:
    enabled: false
    replicas: 1
    port: 8080
    # /metrics rides the main HTTP port (prahari_bff/metrics.py) — same
    # convention as matchEngine/correlation: metricsPort repeats `port`.
    metricsPort: 8080
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }
    # The hash-chained audit log is append-only and must outlive the pod —
    # the one piece of first-party state outside Postgres, on its own PVC.
    auditStorage: 1Gi
    # PRAHARI_SESSION_COOKIE_SECURE override. Empty derives from profile
    # (false only under `local`): Secure cookies require TLS in front. Set
    # "false" explicitly ONLY for a profile that serves plain HTTP — the eks
    # profile today, where LBs terminate nothing. A profile that sets this
    # false while claiming TLS is lying to the browser either way.
    sessionCookieSecure: ""
    volumeMounts:
      - name: audit
        mountPath: /var/lib/prahari/audit
    volumes:
      - name: audit
        persistentVolumeClaim:
          claimName: prahari-audit

  web:
    enabled: false
    replicas: 1
    port: 3000
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 1Gi }

# --- match engine: watchlist decisions ---------------------------------------

matchEngine:
  # The image bakes the synthetic dataset into /app/data/watchlist
  # (services/match-engine/Dockerfile: COPY data/watchlist /app/data/watchlist).
  # Pointing anywhere unmounted leaves the store empty and /readyz at 503 —
  # which is what hung `helm install --wait`. A PVC/ConfigMap mount carrying the
  # real (police) watchlist is a follow-up; what ships here is synthetic.
  watchlistPath: /app/data/watchlist

  # Accuracy thresholds, deliberately values rather than constants: they are
  # tuned against measured precision/recall, and a tuning change must not be a
  # code change.
  #
  # minScore is the floor for surfacing anything at all. Set it too high and the
  # system fails the live test silently — the plate was seen, scored 0.82, and
  # nobody was told. Set it too low and the console fills with noise and gets
  # ignored, which fails the same test more slowly.
  minScore: 0.72
  confirmScore: 0.90

  # One alert per (camera, plate, bucket).
  dedupBucketSeconds: 30

# --- inference: the profile-sensitive service --------------------------------

inference:
  replicas: 1

  # Overridden per profile. See values-local.yaml / values-gpu.yaml.
  model: yolov8n.pt
  decodeBackend: cpu          # cpu | videotoolbox | nvdec
  device: cpu                 # cpu | cuda | mps — model device, never sniffed
  metricsPort: 9090           # worker /metrics endpoint; 0 disables
  samplingFps: 2              # never native rate — most CCTV frames are static
  maxStreamsPerWorker: 5
  batchSize: 4                # batch ACROSS cameras, not within one
  motionGate: true
  gpu: false

  # Matches PRAHARI_INGEST_HEARTBEAT_INTERVAL_S. The registry's staleAfterSeconds
  # is derived from this — about 4x — so one dropped report does not read as an
  # outage. Change one and the other must move with it.
  heartbeatIntervalSeconds: 10

  # How often each worker re-registers and re-fetches its shard of the estate
  # (→ PRAHARI_INGEST_ASSIGNMENT_REFRESH_S). Also the lease keep-alive, so it
  # must stay well below registry.assignment.leaseSeconds (default 60).
  assignmentRefreshSeconds: 30

  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "4", memory: 4Gi }

  keda:
    # Scale on stream-queue depth. Disabled locally (no GPU, and 3-5 streams
    # doesn't exercise it); the scale-up/scale-down curve is the demo beat
    # under the gpu profile.
    enabled: false
    minReplicas: 1
    maxReplicas: 20
    queueLengthTarget: 100

# --- security ----------------------------------------------------------------

security:
  # When true, every secretKeyRef into the `prahari-internal` Secret mounts
  # with `optional: false` — a pod refuses to start if the Secret (or the
  # token key it needs) is absent. That is the loud failure a real profile
  # wants: with `optional: true` a missing Secret starts every pod with
  # empty tokens, and empty tokens mean enforcement OFF — the registry's
  # X-Internal-Token gate, the match-engine gRPC interceptor, and the
  # MediaMTX auth callback all silently disarm at once.
  #
  # The Secret carries per-service caller keys (bff-token, correlation-token,
  # inference-token) plus the legacy shared internal-token. With all of them
  # present the internal gates run "isolated" — a token resolves to a caller
  # identity checked against a per-service allowlist. A Secret missing the
  # per-service keys degrades each gate to the shared-token check, the
  # pre-isolation posture; `make internal-secret` tops an existing Secret up
  # without rewriting existing keys.
  #
  # False here because the local profile is the documented enforcement-off
  # dev mode; every real profile sets it true. The media-JWT key is exempt
  # (see bffEnv) — its absence degrades to an ephemeral keypair, which is a
  # loud, documented behaviour rather than a gate going open.
  internalSecretRequired: false

# The audit log is not optional and not profile-switched: it is the BFF's
# append-only SQLite file on the prahari-audit PVC, always on in every profile.
# The old `audit.enabled`/`requirePurposeCode` values fed PRAHARI_AUDIT_* env
# vars that no settings field read — deleted rather than kept as decoration.

networkPolicies:
  # Default-deny ingress plus explicit per-service allows
  # (templates/networkpolicy.yaml). k3s' default flannel CNI does not enforce
  # NetworkPolicy, so locally these are documentation that happens to be
  # enforceable the day the cluster runs a CNI that is — check the probe
  # caveat in that file before enabling on such a CNI.
  enabled: true

# --- observability -----------------------------------------------------------

# Everything under here is OPT-IN and additive: with `enabled: false` the
# chart renders none of templates/observability.yaml, adds no pod
# annotations, and writes no extra NetworkPolicy rules — the flag being off
# is a true no-op, because a plain `make up` cluster has no scraper and the
# annotations would be decoration. See docs/OBSERVABILITY.md.
observability:
  enabled: false

  # The namespace a Prometheus / OTel-collector scrape workload is expected
  # to run in — it feeds ONLY the NetworkPolicy namespaceSelector
  # (kubernetes.io/metadata.name). A scraper deployed into the release
  # namespace is covered separately, by the podSelector:{} rule.
  monitoringNamespace: monitoring

  # The zero-CRD scrape contract: prometheus.io/* pod annotations on every
  # Deployment that serves /metrics (match-engine :8001, correlation :8002,
  # mediamtx :9998, inference :9090). Works with a plain Prometheus
  # kubernetes_sd pod-role scrape config or the OTel collector's prometheus
  # receiver — the operator is not required for this path.
  prometheusScrape: true

  serviceMonitor:
    # Prometheus Operator ServiceMonitor CRDs, rendered only when explicitly
    # enabled: a cluster without the operator fails `helm install` on the
    # unknown Kind, so this stays off until the CRDs are installed first.
    enabled: false
    # kube-prometheus-stack discovers ServiceMonitors by label — set this to
    # match the stack's serviceMonitorSelector (e.g. {release: prometheus}).
    labels: {}

# --- auth --------------------------------------------------------------------

# Console authentication, switched like a deployment knob (`kind`), mirroring
# the `bus.kind` convention. `builtin` is the argon2 + prahari_session login
# that already exists — it stays the default in EVERY profile so a plain
# `make up` changes nothing and the bootstrap admin remains the break-glass
# path during an IdP outage. `keycloak` puts the console on OIDC
# Authorization Code + PKCE: the BFF does the code exchange server-side and
# still mints the same session cookie, so the console downstream is unchanged.
# See docs/KEYCLOAK.md.
auth:
  kind: builtin # builtin | keycloak

  # Public origin of the console — Keycloak sends the browser back to
  # `{redirectBase}/api/bff/auth/oidc/callback`, which the console's own BFF
  # proxy forwards here. Required when kind=keycloak (the template fails
  # loudly without it rather than rendering a redirect to nowhere); unused
  # under builtin.
  redirectBase: ""

  keycloak:
    # The IN-CHART dev IdP — rendered only when kind=keycloak AND url is
    # empty. It runs `start-dev` (H2, no TLS, bootstrap admin/admin): a
    # laptop-profile convenience, never a production IdP. The gpu profile
    # points `url` at a real external Keycloak and leaves this off.
    enabled: false
    image: keycloak/keycloak:26.7
    realm: prahari
    # External Keycloak base URL (browser-reachable AND pod-reachable) —
    # e.g. https://sso.example.gov.in. Empty means "use the in-chart
    # deployment". When set, keycloak.enabled is ignored.
    url: ""
    # Browser-facing base of the in-chart deployment. The browser and the BFF
    # pod reach the realm through different URLs, and Keycloak pins `iss` to
    # this public one (KC_HOSTNAME); the BFF uses the Service name for the
    # token/JWKS calls. The default expects
    # `kubectl port-forward svc/prahari-keycloak 8081:8080`.
    publicUrl: http://localhost:8081
    # The one confidential client the BFF exchanges codes as. Its secret is
    # NEVER here — it comes from the out-of-band `prahari-oidc` Secret
    # (`kubectl create secret generic prahari-oidc
    #   --from-literal=client-secret=...`), matching the realm import's
    # dev-only value for the in-chart IdP.
    clientId: prahari-bff
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits:   { cpu: "1",  memory: 1536Mi }
