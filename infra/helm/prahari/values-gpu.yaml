# Cloud GPU profile — L4/A10G with k3s, Days 4-5.
#
# Cutover is `helm upgrade --set profile=gpu`, nothing more. If this requires a
# code change, the profile switch is broken.
#
# This is the ONLY profile whose measurements may be cited in docs/SCALE-80K.md,
# and every figure there must trace to a recorded run in infra/loadtest/.

profile: gpu

# auth.kind stays `builtin` until a real external IdP exists. When it does:
# kind=keycloak + keycloak.url — the in-chart Keycloak is a start-dev laptop
# IdP and must NEVER render under this profile. docs/KEYCLOAK.md.
# auth:
#   kind: keycloak
#   redirectBase: https://console.example.gov.in
#   keycloak:
#     url: https://sso.example.gov.in
#     enabled: false

# global.imageRegistry must be set to a registry the cloud cluster can pull
# from (a real ECR/GAR/etc. endpoint) — localhost:5555 is the k3d registry and
# does not exist off the laptop.
# global:
#   imageRegistry: <your cloud registry>

# The bus is Redis Streams; a Redpanda switch for the scale test is deferred
# (see values.yaml — it needs a deployment and a settings field together).

postgres:
  storage: 50Gi

# The console plane runs here too — correlation is REQUIRED for the KEDA
# trigger: it creates the `prahari-correlation` consumer group on
# `prahari:detections`, and the ScaledObject reads that group's pending count.
services:
  correlation:
    enabled: true
  bff:
    enabled: true
  web:
    enabled: true

# mediamtx.publicHost feeds the fan-out URLs handed to in-cluster workers;
# the base default `prahari-mediamtx` is already correct pod-to-pod. Browser
# preview goes through the BFF's audited ticket flow, not this host — only
# override it if an ingress fronts MediaMTX media ports for a reason the
# ticket flow doesn't cover.
# mediamtx:
#   publicHost: streams.example.gov.in

inference:
  replicas: 2
  model: yolov8s.pt
  decodeBackend: nvdec        # hardware decode — the single biggest lever
  device: cuda                # model device for the GPU profile
  samplingFps: 4
  maxStreamsPerWorker: 50     # WORKING ESTIMATE — replace with the measured value
  batchSize: 16               # batch across cameras: worth 3-5x over per-frame
  motionGate: true
  gpu: true

  resources:
    requests:
      cpu: "4"
      memory: 8Gi
      nvidia.com/gpu: 1
    limits:
      cpu: "8"
      memory: 16Gi
      nvidia.com/gpu: 1

  keda:
    # The demo beat: onboard cameras, film the pod count climb 2 -> 20.
    # It must scale back DOWN too — a pool that only grows is not elasticity,
    # and a sharp jury will ask.
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    queueLengthTarget: 100

# The full government catalogue per worker pool is governed by
# inference.maxStreamsPerWorker above (→ PRAHARI_INGEST_MAX_ACTIVE_CAMERAS);
# the old top-level `ingest.maxActiveCameras` was read by nothing.
