# Laptop profile — k3d on macOS, Days 0-3.
#
# k3d on macOS has NO GPU passthrough, so this must be genuinely CPU-viable
# rather than a degraded GPU path. The goal here is to prove the pipeline is
# CORRECT on 3-5 streams. Throughput numbers measured under this profile are
# meaningless and must never reach docs/SCALE-80K.md.

profile: local

# The bus is Redis Streams; a Redpanda switch is deferred (see values.yaml).

# auth.kind stays `builtin` locally on purpose: a plain `make up` keeps the
# password login and bootstrap admin untouched, and the console IA is unchanged
# until the web SSO work lands. To try Keycloak end-to-end:
#   helm upgrade prahari infra/helm/prahari -f infra/helm/prahari/values-local.yaml \
#     --set auth.kind=keycloak --set auth.keycloak.enabled=true
# plus the prahari-oidc Secret and a port-forward — docs/KEYCLOAK.md has the
# full walkthrough.
auth:
  kind: builtin
  redirectBase: http://localhost:3000
  # keycloak:
  #   enabled: true   # renders the in-chart dev IdP (start-dev, admin/admin)

postgres:
  storage: 5Gi

inference:
  replicas: 1
  model: yolov8n.pt           # smallest model; accuracy is not the point yet
  decodeBackend: videotoolbox # macOS hardware decode
  samplingFps: 2
  maxStreamsPerWorker: 5
  batchSize: 4
  motionGate: true
  gpu: false

  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "4",  memory: 6Gi }

  keda:
    enabled: false

# The console plane is real in every profile now — the images exist and the
# console IA landed. LoadBalancer type so the k3d host port maps
# (infra/k3d/cluster.yaml: 3000, 8080) reach them; a ClusterIP service binds
# no node port for the loadbalancer to hit.
services:
  correlation:
    enabled: true
  bff:
    enabled: true
    serviceType: LoadBalancer
  web:
    enabled: true
    serviceType: LoadBalancer

mediamtx:
  serviceType: LoadBalancer  # k3d maps 8554/8888/8889 to the loadbalancer

# Render the scrape wiring on the laptop so the path is exercised: pod
# annotations and the NetworkPolicy rules appear in `helm template`, and a
# `kubectl port-forward pod/... :9090` scrape of the inference worker works.
# k3s' flannel does not enforce NetworkPolicy, and nothing scrapes the
# annotations until a Prometheus/OTel collector exists — docs/OBSERVABILITY.md.
observability:
  enabled: true

# The laptop estate is trimmed by inference.maxStreamsPerWorker above — that is
# the value the chart wires to PRAHARI_INGEST_MAX_ACTIVE_CAMERAS. The old
# top-level `ingest.maxActiveCameras` was read by nothing; the registry still
# onboards and health-tracks the full catalogue.
