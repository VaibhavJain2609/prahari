{{/*
Stateful dependencies. Deliberately in-chart rather than external subcharts:
zero network dependency at install time, and the whole platform comes up from
one `helm install` on a laptop with no registry access.

Under the gpu profile these are still cluster-local — the scale story lives in
the metadata plane's size, not in a managed database.

securityContext note: the upstream postgres/redis/mediamtx images start as root
and drop privileges internally (gosu/su-exec), so `runAsNonRoot` cannot be
asserted on them without breaking their entrypoints. RuntimeDefault seccomp is
applied to every pod; first-party services get the full uid-10001 non-root
context in services.yaml/inference.yaml.
*/}}
{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
  annotations:
    # Keep the generated password across upgrades. Without this, every
    # `helm upgrade` re-rolls randAlphaNum while Postgres auth lives in the
    # PVC's PGDATA — the StatefulSet then restarts with a password that does
    # not match and every client is broken permanently. The escape hatch for a
    # managed credential is `postgres.existingSecret` (see values.yaml).
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # Dev-only credential, generated per install. Real deployments source this
  # from the cloud secret store via Terraform — never from values.yaml, and
  # never committed.
  password: {{ randAlphaNum 24 | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: prahari-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        # The postgres entrypoint starts as root and gosus down to the postgres
        # user (uid 999) — fsGroup keeps the mounted data dir writable by it.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # PostGIS for the registry's spatial queries; TimescaleDB extension is
          # created by migration for the detection time-series.
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "prahari.postgresSecretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: prahari-redis-auth
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
  annotations:
    # Same keep-across-upgrades contract as the postgres Secret above: Redis
    # holds the bus in memory, so a re-rolled password would not strand data —
    # but it WOULD split the estate in two, with restarted consumers
    # authenticating against a secret their still-running peers never saw.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  password: {{ randAlphaNum 24 | quote }}
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-redis
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # `args`, not `command`: the image's docker-entrypoint.sh must keep
          # running — it is what drops root to the redis user. A leading flag
          # makes the entrypoint prepend `redis-server` itself.
          # `--requirepass "$(REDIS_PASSWORD)"` with an EMPTY expansion is a
          # Redis no-op (auth disabled), which is exactly the degrade we want
          # when the Secret is absent: the bus stays up, and every consumer's
          # redis://:@host URL (empty password) connects either way.
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "prahari.redisSecretName" . }}
                  key: password
                  # optional so the chart still comes up without the Secret —
                  # empty password = auth off, loudly equivalent to the
                  # internal-token convention elsewhere. A profile that
                  # expects auth must create the Secret (chart-generated by
                  # default, or redis.existingSecret).
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          # `redis-cli ping` unauthenticated is a NOAUTH once requirepass is
          # armed — the probe must authenticate, but only when a password
          # actually exists.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  if [ -n "$REDIS_PASSWORD" ]; then
                    redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping;
                  else redis-cli ping; fi
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  if [ -n "$REDIS_PASSWORD" ]; then
                    redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping;
                  else redis-cli ping; fi
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-redis
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
{{- if .Values.mediamtx.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-mediamtx
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: mediamtx
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mediamtx
          image: {{ .Values.mediamtx.image }}
          ports:
            - name: rtsp
              containerPort: {{ .Values.mediamtx.rtspPort }}
            - name: hls
              containerPort: {{ .Values.mediamtx.hlsPort }}
            - name: whep
              containerPort: {{ .Values.mediamtx.whepPort }}
            - name: api
              containerPort: {{ .Values.mediamtx.apiPort }}
            - name: metrics
              containerPort: {{ .Values.mediamtx.metricsPort }}
          resources:
            {{- toYaml .Values.mediamtx.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
          # TCP probes: the API answers HTTP but there is no guaranteed-200
          # health endpoint, so we probe what must be listening. Readiness on
          # the RTSP listener (the port consumers actually use), liveness on
          # the API listener.
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.rtspPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.apiPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prahari-mediamtx
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-mediamtx
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: {{ .Values.mediamtx.rtspPort }}
    - name: hls
      port: {{ .Values.mediamtx.hlsPort }}
    - name: whep
      port: {{ .Values.mediamtx.whepPort }}
    # The registry reaches this to write camera paths from the catalogue. Not
    # mapped to a host port: reconfiguring the restreamer is an in-cluster
    # operation only.
    - name: api
      port: {{ .Values.mediamtx.apiPort }}
    - name: metrics
      port: {{ .Values.mediamtx.metricsPort }}
{{- end }}
