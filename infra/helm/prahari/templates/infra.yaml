{{/*
Stateful dependencies. Deliberately in-chart rather than external subcharts:
zero network dependency at install time, and the whole platform comes up from
one `helm install` on a laptop with no registry access.

Under the gpu profile these are still cluster-local — the scale story lives in
the metadata plane's size, not in a managed database.

securityContext note: the upstream postgres/redis/mediamtx images start as root
and drop privileges internally (gosu/su-exec), so `runAsNonRoot` cannot be
asserted on them without breaking their entrypoints. RuntimeDefault seccomp is
applied to every pod; first-party services get the full uid-10001 non-root
context in services.yaml/inference.yaml.
*/}}
{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "prahari-postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
  annotations:
    # Only deletion is skipped — `keep` does NOT stop helm upgrade from
    # patching this Secret. The generated password is instead preserved by
    # `lookup` below: re-rolling randAlphaNum while Postgres auth lives in the
    # PVC's PGDATA would leave every client with a credential Postgres never
    # learned. The escape hatch for a managed credential is
    # `postgres.existingSecret` (see values.yaml).
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Dev-only credential, generated per install and held stable across upgrades
  # by `lookup` (empty under `helm template`/`--dry-run`, so first render
  # generates; that render is never applied anyway). Real deployments source
  # this from the cloud secret store via Terraform — never from values.yaml,
  # and never committed.
  password: {{ if and $existing $existing.data $existing.data.password }}{{ $existing.data.password | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: prahari-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        # The postgres entrypoint starts as root and gosus down to the postgres
        # user (uid 999) — fsGroup keeps the mounted data dir writable by it.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # PostGIS for the registry's spatial queries; TimescaleDB extension is
          # created by migration for the detection time-series.
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "prahari.postgresSecretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass.name }}
        storageClassName: {{ .Values.storageClass.name | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-postgres
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.existingSecret) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "prahari-redis-auth" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: prahari-redis-auth
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
  annotations:
    # Same contract as the postgres Secret above: `keep` alone does not stop
    # upgrades re-rolling randAlphaNum, so `lookup` pins the value. Redis holds
    # the bus in memory, so a re-rolled password would not strand data — but it
    # WOULD split the estate in two, with restarted consumers authenticating
    # against a secret their still-running peers never saw.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ if and $existing $existing.data $existing.data.password }}{{ $existing.data.password | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-redis
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # `args`, not `command`: the image's docker-entrypoint.sh must keep
          # running — it is what drops root to the redis user. A leading flag
          # makes the entrypoint prepend `redis-server` itself.
          # `--requirepass "$(REDIS_PASSWORD)"` with an EMPTY expansion is a
          # Redis no-op (auth disabled), which is exactly the degrade we want
          # when the Secret is absent: the bus stays up, and every consumer's
          # redis://:@host URL (empty password) connects either way.
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "prahari.redisSecretName" . }}
                  key: password
                  # optional so the chart still comes up without the Secret —
                  # empty password = auth off, loudly equivalent to the
                  # internal-token convention elsewhere. A profile that
                  # expects auth must create the Secret (chart-generated by
                  # default, or redis.existingSecret).
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          # `redis-cli ping` unauthenticated is a NOAUTH once requirepass is
          # armed — the probe must authenticate, but only when a password
          # actually exists.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  if [ -n "$REDIS_PASSWORD" ]; then
                    redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping;
                  else redis-cli ping; fi
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  if [ -n "$REDIS_PASSWORD" ]; then
                    redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping;
                  else redis-cli ping; fi
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-redis
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
{{- if .Values.mediamtx.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-mediamtx
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: mediamtx
      {{- if and .Values.observability.enabled .Values.observability.prometheusScrape }}
      # MediaMTX's own Prometheus exposition (metrics: yes in
      # mediamtx-config.yaml) — unauthenticated by design (the auth callback
      # excludes the metrics action), so the NetworkPolicy is the boundary.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.mediamtx.metricsPort }}"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mediamtx
          image: {{ .Values.mediamtx.image }}
          ports:
            - name: rtsp
              containerPort: {{ .Values.mediamtx.rtspPort }}
            - name: hls
              containerPort: {{ .Values.mediamtx.hlsPort }}
            - name: whep
              containerPort: {{ .Values.mediamtx.whepPort }}
            - name: api
              containerPort: {{ .Values.mediamtx.apiPort }}
            - name: metrics
              containerPort: {{ .Values.mediamtx.metricsPort }}
          resources:
            {{- toYaml .Values.mediamtx.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
            {{- if .Values.mediamtx.record.enabled }}
            - name: recordings
              mountPath: /recordings
            {{- end }}
          # TCP probes: the API answers HTTP but there is no guaranteed-200
          # health endpoint, so we probe what must be listening. Readiness on
          # the RTSP listener (the port consumers actually use), liveness on
          # the API listener.
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.rtspPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mediamtx.apiPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prahari-mediamtx
        {{- if .Values.mediamtx.record.enabled }}
        - name: recordings
          persistentVolumeClaim:
            claimName: prahari-mediamtx-recordings
        {{- end }}
{{- if .Values.mediamtx.record.enabled }}
---
# Recording storage. MediaMTX writes fmp4 segments here; `recordDeleteAfter`
# bounds retention so this does not grow unboundedly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prahari-mediamtx-recordings
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storageClass.name }}
  storageClassName: {{ .Values.storageClass.name | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mediamtx.record.storageSize }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-mediamtx
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  # LoadBalancer in the local profile so k3d's host port maps (8554/8888/8889)
  # actually reach it — a ClusterIP binds no node port for the loadbalancer.
  # On a real cloud this stays ClusterIP and prahari-mediamtx-public (below)
  # is the LB: exposing ALL five ports on one LB would publish the control
  # API and metrics to the internet.
  type: {{ .Values.mediamtx.serviceType | default "ClusterIP" }}
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: {{ .Values.mediamtx.rtspPort }}
    - name: hls
      port: {{ .Values.mediamtx.hlsPort }}
    - name: whep
      port: {{ .Values.mediamtx.whepPort }}
    # The registry reaches this to write camera paths from the catalogue. Not
    # mapped to a host port: reconfiguring the restreamer is an in-cluster
    # operation only.
    - name: api
      port: {{ .Values.mediamtx.apiPort }}
    - name: metrics
      port: {{ .Values.mediamtx.metricsPort }}
{{- if .Values.mediamtx.publicLb.enabled }}
---
# The public media surface: rtsp/hls/whep ONLY. The control API (which can
# rewrite every upstream path) and metrics deliberately stay on the ClusterIP
# service above — a LoadBalancer publishing 9997 would hand the internet the
# restreamer's configuration and its credentialed source URLs.
apiVersion: v1
kind: Service
metadata:
  name: prahari-mediamtx-public
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
  {{- if or .Values.mediamtx.publicLb.annotations (and .Values.tls.enabled .Values.tls.acmArn) }}
  annotations:
    {{- if .Values.mediamtx.publicLb.annotations }}
    {{- toYaml .Values.mediamtx.publicLb.annotations | nindent 4 }}
    {{- end }}
    {{- if and .Values.tls.enabled .Values.tls.acmArn }}
    # TLS terminates at the NLB (ACM cert). Only 443 is TLS-terminated — WHEP
    # over https://<streamsHost>. RTSP 8554 stays raw TCP by necessity (RTSPS
    # is a different protocol path the chart does not implement), and the
    # plain WHEP/HLS ports remain for in-VPC consumers.
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: {{ .Values.tls.acmArn | quote }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    {{- end }}
  {{- end }}
spec:
  type: LoadBalancer
  selector:
    {{- include "prahari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: {{ .Values.mediamtx.rtspPort }}
      targetPort: {{ .Values.mediamtx.rtspPort }}
    - name: hls
      port: {{ .Values.mediamtx.hlsPort }}
      targetPort: {{ .Values.mediamtx.hlsPort }}
    - name: whep
      port: {{ .Values.mediamtx.whepPort }}
      targetPort: {{ .Values.mediamtx.whepPort }}
    {{- if and .Values.tls.enabled .Values.tls.acmArn }}
    - name: wheps
      port: 443
      targetPort: {{ .Values.mediamtx.whepPort }}
    {{- end }}
{{- end }}
{{- end }}
