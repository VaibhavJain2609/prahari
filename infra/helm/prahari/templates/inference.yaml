{{/*
The inference workers — the only profile-sensitive workload.

Everything that differs between the laptop and the GPU node is a value, not a
code path: model size, decode backend, sampling rate, batch size, replica count
and resource requests. If a cutover ever needs a code change, the switch is
broken.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-inference
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
    app.kubernetes.io/name: inference
spec:
  {{- if not .Values.inference.keda.enabled }}
  replicas: {{ .Values.inference.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: inference
  template:
    metadata:
      labels:
        {{- include "prahari.labels" . | nindent 8 }}
        app.kubernetes.io/name: inference
      {{- if and .Values.observability.enabled .Values.observability.prometheusScrape .Values.inference.metricsPort }}
      # prometheus.io/* scrape contract for the worker /metrics listener —
      # the prahari-inference-metrics Service (observability.yaml) is the
      # stable target; these annotations cover pod-role scrapers.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.inference.metricsPort }}"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          # `inference.image` is a full-ref override — this is how the gpu
          # profile selects the CUDA variant (prahari-inference:<tag>-cuda,
          # services/inference/Dockerfile.gpu) without a template change.
          image: {{ .Values.inference.image | default (include "prahari.image" (dict "registry" .Values.global.imageRegistry "name" "inference" "tag" .Values.global.imageTag)) }}
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if .Values.inference.metricsPort }}
          ports:
            # Plaintext /metrics (PRAHARI_INGEST_METRICS_PORT below, 0 = off).
            # Named so the prahari-inference-metrics Service and the
            # NetworkPolicy rule can target it without duplicating the number.
            - name: metrics
              containerPort: {{ .Values.inference.metricsPort }}
          {{- end }}
          env:
            {{- include "prahari.commonEnv" . | nindent 12 }}
            # PRAHARI_INGEST_* is the env_prefix of IngestSettings. The names
            # must match the settings class exactly: a knob the chart sets and
            # the code never reads is a profile switch that silently does not
            # switch, which is worse than no knob at all.
            - name: PRAHARI_INGEST_MAX_ACTIVE_CAMERAS
              value: {{ .Values.inference.maxStreamsPerWorker | quote }}
            # Never the native rate. Most CCTV frames are static.
            - name: PRAHARI_INGEST_SAMPLE_FPS
              value: {{ .Values.inference.samplingFps | quote }}
            - name: PRAHARI_INGEST_REGISTRY_URL
              value: "http://prahari-registry:{{ .Values.services.registry.port }}"
            - name: PRAHARI_INGEST_HEARTBEAT_INTERVAL_S
              value: {{ .Values.inference.heartbeatIntervalSeconds | quote }}
            # Worker identity for registry sharding: the pod name, explicitly —
            # the same value every camera heartbeat carries, so "which pod owns
            # this camera" and "which slice is this pod pulling" share one id.
            # fieldRef, not a hostname lookup, so the contract does not depend
            # on the runtime setting $HOSTNAME the same way.
            - name: PRAHARI_INGEST_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Register + re-fetch this worker's shard on this cadence — the
            # lease keep-alive. Must stay below registry.assignment.leaseSeconds
            # (default 60) or this pod drops out of shard_count while alive.
            - name: PRAHARI_INGEST_ASSIGNMENT_REFRESH_S
              value: {{ .Values.inference.assignmentRefreshSeconds | quote }}
            # PRAHARI_DETECT_* is read by DetectorSettings — asserted by
            # tests/test_detector_settings.py.
            - name: PRAHARI_DETECT_MODEL
              value: {{ .Values.inference.model | quote }}
            # cpu | videotoolbox | nvdec — selected here, never sniffed at runtime.
            - name: PRAHARI_DETECT_DECODE_BACKEND
              value: {{ .Values.inference.decodeBackend | quote }}
            # Batch ACROSS cameras, not within one — worth 3-5x over per-frame.
            - name: PRAHARI_DETECT_BATCH_SIZE
              value: {{ .Values.inference.batchSize | quote }}
            - name: PRAHARI_DETECT_MOTION_GATE
              value: {{ .Values.inference.motionGate | quote }}
            - name: PRAHARI_DETECT_MATCH_ENGINE_GRPC
              value: "prahari-match-engine:{{ .Values.services.matchEngine.grpcPort }}"
            # Workers never connect to the government feed directly and never
            # need a MediaMTX URL from the chart: the registry hands each worker
            # its fan-out URL in the assignment response (worker.py prefers
            # fanout_rtsp_url), so the old PRAHARI_MEDIAMTX_RTSP/_HLS fallbacks
            # here were dead env — deleted, not re-pointed.
            #
            # One identity authenticates the worker to BOTH gated peers —
            # X-Internal-Token on registry heartbeats/assignments and
            # x-internal-token metadata on the match-engine gRPC stream.
            # Its OWN `inference` caller token now: both receivers run
            # isolated gates that resolve it to `inference`, so a leaked
            # worker token reaches only the surfaces inference may call —
            # not correlation, and nothing under a different identity.
            # optional is security.internalSecretRequired-driven: false for
            # local dev (empty token = enforcement off, warned at startup),
            # true in real profiles so a missing prahari-internal Secret
            # fails the pod instead of silently disarming the gates.
            - name: PRAHARI_INGEST_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prahari-internal
                  key: inference-token
                  optional: {{ not .Values.security.internalSecretRequired }}
            # Model device — selected here, never sniffed at runtime. The gpu
            # profile sets cuda; local stays cpu.
            - name: PRAHARI_DETECT_DEVICE
              value: {{ .Values.inference.device | quote }}
            # Plaintext /metrics endpoint for the worker counters. 0 = off.
            - name: PRAHARI_INGEST_METRICS_PORT
              value: {{ .Values.inference.metricsPort | quote }}
          resources:
            {{- toYaml .Values.inference.resources | nindent 12 }}
          # No HTTP probe: a worker serves no traffic and has no port to GET.
          # The failure worth catching is the process alive with every pump
          # thread dead, which an HTTP-less pod cannot express and a port probe
          # against a closed port would report as a permanent outage.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  test $(( $(date +%s) - $(stat -c %Y /tmp/prahari-worker-alive) ))
                  -lt {{ mul .Values.inference.heartbeatIntervalSeconds 4 | int }}
            # Generous: the first pass waits out one full heartbeat interval, and
            # a restart loop on a healthy worker costs more than a late restart.
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      {{- if .Values.inference.gpu }}
      # GPU profile only. k3d on macOS has no GPU passthrough, so the local
      # profile must remain genuinely CPU-viable.
      runtimeClassName: nvidia
      {{- end }}
{{- if .Values.inference.keda.enabled }}
---
# Requires the KEDA CRDs — a gpu-profile prerequisite that must be installed on
# the cluster BEFORE this chart (`helm install keda kedacore/keda`), or this
# ScaledObject fails to apply.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prahari-inference
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: prahari-inference
  minReplicaCount: {{ .Values.inference.keda.minReplicas }}
  maxReplicaCount: {{ .Values.inference.keda.maxReplicas }}
  # Scale down deliberately slowly: thrashing GPU pods costs more than it saves,
  # and the scale-DOWN curve is part of the elasticity demo. A pool that only
  # grows is not elasticity.
  cooldownPeriod: 120
  # Redis is requirepass-armed (prahari-redis-auth) — the scaler needs the same
  # credential or every trigger poll returns NOAUTH and KEDA logs errors while
  # the replica count sits frozen at minReplicas.
  authenticationRef:
    name: prahari-redis-auth
  triggers:
    # The bus is Redis Streams, not a list — the previous `redis` scaler watched
    # `prahari:frames:pending`, a key nothing produces, so the trigger would
    # have read zero forever.
    #
    # This scales on the pending-entries backlog of consumer group
    # `prahari-correlation` on the detections stream: the deepest queue in the
    # metadata plane and the honest "the pipeline is saturated" signal. Caveats:
    # the consumer group must actually exist (the correlation service creates it
    # on connect — with correlation disabled there is no group and nothing to
    # measure), and worker count is an indirect lever on a downstream backlog.
    # Revisit against a measured run before citing scale numbers from it.
    - type: redis-streams
      metadata:
        address: prahari-redis:6379
        stream: prahari:detections
        consumerGroup: prahari-correlation
        pendingEntriesCount: {{ .Values.inference.keda.queueLengthTarget | quote }}
---
# The scaler's credential — same Secret the in-chart Redis enforces and every
# first-party consumer reads (prahari.redisPasswordEnv).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prahari-redis-auth
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: prahari-redis-auth
      key: password
{{- end }}
