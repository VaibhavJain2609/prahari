{{- $svcNames := dict "registry" "registry" "matchEngine" "match-engine" "correlation" "correlation" "bff" "bff" "web" "web" -}}
{{- range $key, $cfg := .Values.services }}
{{- $name := index $svcNames $key }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-{{ $name }}
  labels:
    {{- include "prahari.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      {{- include "prahari.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "prahari.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      # First-party images create uid 10001 `prahari` and drop to it
      # (services/*/Dockerfile). Services without a Dockerfile yet
      # (correlation, bff, web) must follow the same convention.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          # Per-service `image` is a full-ref override — Tilt injects its
          # generated refs there (services.<key>.image), since a single
          # global registry+tag pair cannot express six independently built
          # images.
          image: {{ $cfg.image | default (include "prahari.image" (dict "registry" $.Values.global.imageRegistry "name" $name "tag" $.Values.global.imageTag)) }}
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
            {{- if $cfg.grpcPort }}
            - name: grpc
              containerPort: {{ $cfg.grpcPort }}
            {{- end }}
          env:
            {{- include "prahari.commonEnv" $ | nindent 12 }}
            {{- if eq $name "registry" }}
            {{- include "prahari.registryEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $name "match-engine" }}
            {{- include "prahari.matchEngineEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $name "correlation" }}
            {{- include "prahari.correlationEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $name "bff" }}
            {{- include "prahari.bffEnv" $ | nindent 12 }}
            {{- end }}
            {{- if eq $name "web" }}
            {{- include "prahari.webEnv" $ | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- if $cfg.volumeMounts }}
          volumeMounts:
            {{- toYaml $cfg.volumeMounts | nindent 12 }}
          {{- end }}
          # Readiness and liveness are DIFFERENT endpoints on purpose.
          #
          # /readyz checks the database; /healthz does not. A liveness probe that
          # fails when Postgres is unreachable restarts every pod during a
          # database blip — turning a recoverable outage into a rolling restart
          # that guarantees a longer one. Readiness is the probe that should
          # notice: take the pod out of the Service, leave the process alone.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $cfg.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $cfg.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            # The registry applies its own migrations on startup under an
            # advisory lock. On a cold cluster that waits for Postgres to accept
            # connections, which is comfortably longer than the liveness probe
            # would allow — hence a startup probe rather than a larger
            # initialDelaySeconds, which would also delay every later restart.
            httpGet:
              path: /healthz
              port: {{ $cfg.port }}
            periodSeconds: 5
            failureThreshold: 24
      {{- if $cfg.volumes }}
      volumes:
        {{- toYaml $cfg.volumes | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prahari-{{ $name }}
  labels:
    {{- include "prahari.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  # ClusterIP everywhere except where a profile asks for LoadBalancer — the
  # k3d cluster maps host ports to the loadbalancer (infra/k3d/cluster.yaml),
  # and a ClusterIP service never binds a node port for it to reach.
  type: {{ $cfg.serviceType | default "ClusterIP" }}
  selector:
    {{- include "prahari.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: {{ $cfg.port }}
    {{- if $cfg.grpcPort }}
    - name: grpc
      port: {{ $cfg.grpcPort }}
      targetPort: {{ $cfg.grpcPort }}
    {{- end }}
{{- end }}
{{- end }}
