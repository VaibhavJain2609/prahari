{{- if .Values.mediamtx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prahari-mediamtx
  labels:
    {{- include "prahari.labels" . | nindent 4 }}
data:
  mediamtx.yml: |
    # MediaMTX — the restreaming layer.
    #
    # Every client gets its own copy of a source stream, so N consumers opening N
    # direct connections would exhaust the government feed. MediaMTX pulls each
    # camera ONCE and fans it out to inference workers and browser previews alike.
    #
    # Paths are written here by the registry's catalogue sync, never hand-edited:
    # the catalogue is the contract, the URL pattern is not.

    logLevel: info
    logDestinations: [stdout]

    # --- Authentication -----------------------------------------------------
    #
    # authMethod is EXCLUSIVE in mediamtx 1.9.x (internal | http | jwt — an
    # internal-users-plus-JWT hybrid does not exist), so we delegate every
    # credential check to the registry over HTTP. That one endpoint
    # (media_auth.py) recognises both shapes the estate needs:
    #
    #   * machines  — HTTP basic. Inference workers read with
    #     `worker:<worker-token>` embedded in the fan-out URL the registry
    #     hands them; the registry's own reconcile calls the control API as
    #     `internal:<internal-token>`. Two SEPARATE secrets — the
    #     `worker-token` and `internal-token` keys of `prahari-internal` —
    #     because the media credential travels inside URLs on every worker
    #     pod and must not also be the internal-API credential.
    #   * browsers  — a short-lived Ed25519 JWT minted by the BFF's audited
    #     /api/v1/media/preview-ticket. The client sends it as
    #     `Authorization: Bearer` or `?jwt=`; mediamtx forwards it in the auth
    #     request's `query` field and the registry verifies it against the
    #     BFF's public JWKS.
    #
    # Metrics are excluded — Prometheus scrapes carry no credentials; the
    # listener stays cluster-internal regardless (networkpolicy.yaml).
    # `api` is deliberately NOT excluded: the control API leaks the
    # credentialed upstream source URLs it is configured with, so it goes
    # through the same check as everything else.
    authMethod: http
    authHTTPAddress: http://prahari-registry:{{ .Values.services.registry.port }}/api/v1/mediamtx/auth
    authHTTPExclude:
    - action: metrics
    - action: pprof

    # Read timeouts sized for the reconnect policy: 2s start, 30s cap, jittered.
    readTimeout: 10s
    writeTimeout: 10s
    writeQueueSize: 1024

    # RTSP: TCP only. UDP transport drops silently under load and produces
    # corrupt frames that look like detections.
    # Key names are the 1.9.x schema (`protocols`/`encryption`, singular
    # `rtspTransport` on paths) — the pre-1.9 `rtspTransports`/`rtspEncryption`/
    # `sourceProtocol` forms make the server refuse to start on
    # `unknown field`.
    rtsp: yes
    rtspAddress: :{{ .Values.mediamtx.rtspPort }}
    protocols: [tcp]
    encryption: "no"

    # HLS: the fallback when port 8554 is blocked on a venue network. Not
    # optional — it must be tested, not assumed.
    hls: yes
    hlsAddress: :{{ .Values.mediamtx.hlsPort }}
    hlsVariant: lowLatency
    hlsAlwaysRemux: no

    # WebRTC/WHEP: browser preview ONLY. Never an inference source — the browser
    # path re-encodes and loses the PTS fidelity that evidence timestamps need.
    webrtc: yes
    webrtcAddress: :{{ .Values.mediamtx.whepPort }}

    # We consume only. Never publish to the government gateway, never call its
    # control API.
    api: yes
    apiAddress: :{{ .Values.mediamtx.apiPort }}

    # Prometheus-compatible metrics (mediamtx 1.9.x top-level `metrics` /
    # `metricsAddress` — confirmed against the v1.9 config reference). Cluster-
    # internal only, same posture as the control API.
    metrics: yes
    metricsAddress: :{{ .Values.mediamtx.metricsPort }}

    pathDefaults:
      # Pull on demand and release when idle, so we hold connections only to
      # cameras actually in use.
      sourceOnDemand: yes
      sourceOnDemandStartTimeout: 15s
      sourceOnDemandCloseAfter: 30s
      # Same name the registry writes into per-path bodies
      # (mediamtx.py) — TCP-only upstream pulls, matching the global
      # `protocols` list above.
      rtspTransport: tcp
      {{- if .Values.mediamtx.record.enabled }}
      # Evidence recording (docs/EVIDENCE.md). Playback tickets already carry
      # the `playback` grant — the registry's auth callback validates them —
      # so enabling this is the only change the evidence chain needs.
      record: yes
      recordPath: {{ .Values.mediamtx.record.path }}
      recordFormat: {{ .Values.mediamtx.record.format }}
      recordPartDuration: {{ .Values.mediamtx.record.partDuration }}
      recordSegmentDuration: {{ .Values.mediamtx.record.segmentDuration }}
      recordDeleteAfter: {{ .Values.mediamtx.record.deleteAfter }}
      {{- end }}

    paths:
      # Populated at runtime by the registry from GET /api/ingest.
      # Intentionally empty here — a hardcoded path would pass locally and fail
      # on demo day when ids rotate.
{{- end }}
