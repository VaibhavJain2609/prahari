[project]
name = "prahari-registry"
version = "0.1.0"
description = "PRAHARI camera registry: catalogue sync, PostGIS coverage, live camera health"
# Matches the workspace pin. The registry itself has no 3.12-only dependency;
# a single interpreter across the workspace is worth more than the freedom.
requires-python = ">=3.12,<3.13"

dependencies = [
    "prahari-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
prahari-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_registry"]

# Migrations ship inside the image: the service applies its own schema on
# startup, so a fresh `helm install` needs no separate migration job and no
# `kubectl exec`.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "prahari_registry/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
