[project]
name = "prahari-inference"
version = "0.1.0"
description = "PRAHARI edge inference: stream ingest, detection, ANPR"
# Pinned to 3.12: PyTorch and Ultralytics publish no wheels for 3.14, and
# building them from source on demo day is not a recoverable position.
requires-python = ">=3.12,<3.13"

dependencies = [
    "prahari-common",
    "prahari-proto",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "grpcio>=1.66",
    "protobuf>=5.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]
# Multi-gigabyte, CUDA-aware wheels. Absent from `dev` and from `make test` on
# purpose — every backend behind these has a scripted fake (detect/types.py),
# and this group only matters where real weights actually run (Day 4, GPU).
models = ["ultralytics>=8.3", "paddleocr>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
prahari-common = { workspace = true }
prahari-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Enforces the rtsp_env indirection. A bare `import cv2` initialises the FFmpeg
# backend before OPENCV_FFMPEG_CAPTURE_OPTIONS is set, silently dropping the
# TCP transport — which shows up as corrupt frames, not as an error.
"cv2".msg = "import cv2 via `from .rtsp_env import cv2` so RTSP-over-TCP is set first"
# Both are multi-gigabyte, CUDA-aware installs. A module-level import means
# `make test` needs them on disk, which is how a broken cascade reaches demo
# day looking green — see detect/types.py. Confined to each backend's `_load()`.
"ultralytics".msg = "import ultralytics lazily, inside a _load() method only"
"paddleocr".msg = "import paddleocr lazily, inside a _load() method only"

[tool.ruff.lint.per-file-ignores]
"src/prahari_inference/rtsp_env.py" = ["TID251"]
"src/prahari_inference/detect/vehicles.py" = ["TID251"]
"src/prahari_inference/detect/plates.py" = ["TID251"]
