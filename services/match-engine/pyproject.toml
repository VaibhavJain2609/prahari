[project]
name = "prahari-match"
version = "0.1.0"
description = "PRAHARI match engine: confusion-aware watchlist matching, dedup, alert fan-out"
requires-python = ">=3.12,<3.13"

dependencies = [
    "prahari-common",
    "prahari-proto",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "grpcio>=1.66",
    "protobuf>=5.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
prahari-common = { workspace = true }
prahari-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
