[project]
name = "prahari-bff"
version = "0.1.0"
description = "PRAHARI BFF: identity, sessions, API keys, audit chain, and the browser-facing surface"
# Matches the workspace pin.
requires-python = ">=3.12,<3.13"

dependencies = [
    "prahari-common",
    "prahari-proto",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "protobuf>=5.28",
    "redis>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
prahari-common = { workspace = true }
prahari-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_bff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
