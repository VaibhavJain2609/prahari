version: v2
managed:
  enabled: true
plugins:
  # Remote plugin versions are pinned for reproducibility — an unpinned ref
  # silently tracks latest, and protobuf validates gencode against the runtime
  # at import, so a drifting plugin can break every service at once.
  # `protocolbuffers/*:v36.1` emits code for protobuf 7.36.x (the locked
  # runtime); `grpc/python:v1.83.0` tracks the grpcio 1.83 pin in uv.lock.
  #
  # Python stubs land inside the `prahari-proto` workspace package rather than a
  # loose gen/ directory. Generated protobuf imports are absolute
  # (`from prahari.v1 import common_pb2`), so the package root must literally
  # contain `prahari/v1/` — which means the generated tree has to BE an
  # installable package, not a directory some service adds to sys.path.
  - remote: buf.build/protocolbuffers/python:v36.1
    out: ../packages/prahari-proto/src
  - remote: buf.build/protocolbuffers/pyi:v36.1
    out: ../packages/prahari-proto/src
  - remote: buf.build/grpc/python:v1.83.0
    out: ../packages/prahari-proto/src
  # No TypeScript target: REST + SSE is the browser contract and web/ consumes
  # no generated TS — the plugin generated dead code into the gitignored gen/.
  # Re-add `bufbuild/es` (pinned, e.g. v2.x) when a consumer exists.
