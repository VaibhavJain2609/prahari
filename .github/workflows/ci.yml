# CI for PRAHARI. Every job mirrors a `make` target or a build the repo already
# documents, so a red job here means "this would fail on a fresh clone", not
# "CI has its own opinion".
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # buf breaking needs real history: it diffs proto/ against main.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      # The stubs are gitignored, so this ordering is load-bearing: buf
      # generate must run before uv sync, or the prahari-proto workspace
      # package installs empty and every test ImportErrors on `prahari.v1`.
      - name: Lint the contract
        run: cd proto && buf lint

      - name: Regenerate stubs
        run: cd proto && buf generate

      - name: Breaking-change check against main
        # `.git#branch=main` resolves a LOCAL ref, which a PR checkout does not
        # have — fetch it first. On pushes to main the branch already exists
        # and the check trivially passes; PRs are where it does its work.
        run: |
          git rev-parse --verify --quiet refs/heads/main >/dev/null \
            || git fetch --no-tags origin main:refs/heads/main
          cd proto && buf breaking --against '../.git#branch=main,subdir=proto'

      - name: Install the workspace
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      # The profile switch is the repo's central deployment claim: both
      # profiles must lint AND render, or `profile` is not the only thing that
      # differs between the laptop and the cloud.
      - name: Lint both profiles
        run: |
          helm lint infra/helm/prahari --values infra/helm/prahari/values-local.yaml
          helm lint infra/helm/prahari --values infra/helm/prahari/values-gpu.yaml

      - name: Render both profiles
        run: |
          helm template prahari infra/helm/prahari --values infra/helm/prahari/values-local.yaml >/dev/null
          helm template prahari infra/helm/prahari --values infra/helm/prahari/values-gpu.yaml >/dev/null

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `next build` before tsc: Next 16 generates LayoutProps/PageProps into
      # .next/types at build time, and the console layout references them —
      # a bare tsc on a fresh checkout fails without it.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # `make proto` because the generated stubs are gitignored — without them
      # the prahari-proto wheel builds empty and the failure only surfaces as
      # an ImportError when the container starts, not at build time.
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate protobuf stubs
        run: make proto

      # Build only — no push. All six images build from the workspace root;
      # each service's Dockerfile explains why (uv workspace members in
      # packages/ sit outside any narrower context).
      - name: Build all images
        run: |
          docker build -f services/registry/Dockerfile     -t prahari-registry:ci     .
          docker build -f services/inference/Dockerfile    -t prahari-inference:ci    .
          docker build -f services/match-engine/Dockerfile -t prahari-match-engine:ci .
          docker build -f services/correlation/Dockerfile  -t prahari-correlation:ci  .
          docker build -f services/bff/Dockerfile          -t prahari-bff:ci          .
          docker build -f web/Dockerfile                   -t prahari-web:ci          .

      # The gpu variant too — always, not gated: the CPU build above already
      # pays the torch/CUDA wheel download (the lock resolves linux cu13
      # wheels), the shared uv cache mount makes this mostly layer work, and a
      # Dockerfile only built on demand rots before Day 4.
      - name: Build the gpu image
        run: |
          docker build -f services/inference/Dockerfile.gpu -t prahari-inference:ci-cuda .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: fmt
        run: terraform -chdir=infra/terraform/envs/demo fmt -check -recursive

      - name: init + validate
        # -backend=false: this config's backend is not configured in CI and
        # validate does not need remote state.
        run: |
          terraform -chdir=infra/terraform/envs/demo init -backend=false
          terraform -chdir=infra/terraform/envs/demo validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Scan history, not just the tip: a committed-and-reverted secret is
          # still a committed secret.
          fetch-depth: 0

      # Binary install rather than gitleaks/gitleaks-action: the action needs a
      # GITLEAKS_LICENSE secret for org repos, and a pinned release tarball has
      # no such precondition.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan
        run: gitleaks git --verbose .
