[project]
name = "prahari-proto"
version = "0.1.0"
description = "PRAHARI generated protobuf/gRPC stubs — regenerate with `make proto`, never hand-edit"
requires-python = ">=3.12,<3.13"

dependencies = [
    "protobuf>=5.28",
    "grpcio>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prahari"]

[tool.ruff]
# Generated code. Linting it produces findings nobody may act on, because the
# only legal fix is to change the .proto and regenerate.
exclude = ["src/prahari"]
